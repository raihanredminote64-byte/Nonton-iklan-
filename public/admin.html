<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Admin - Kontrol Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        header, .admin-view { width: 100%; max-width: 950px; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; box-sizing: border-box; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .admin-section-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .admin-card { background: white; padding: 15px; border-radius: 10px; border: 1px solid #e5e7eb; margin-bottom: 10px; }
        .action-btn { background: #4f46e5; color: white; border: none; padding: 10px 15px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; }
        input[type="text"] { width: 100%; padding: 10px; margin: 6px 0 10px 0; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; }
        select { padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; background: white; }
        .user-filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .user-filter-bar input[type="text"] { flex: 1 1 200px; margin: 0; }
        .user-filter-bar select { flex: 0 1 auto; }
        .user-filter-bar .action-btn { flex: 0 0 auto; }
    </style>
</head>
<body>
    <div id="admin-auth" class="admin-view" style="max-width:420px; margin-top:40px;">
        <h3 style="margin-top:0;">🔐 Login Admin</h3>
        <p style="font-size:13px; color:#6b7280;">Masuk dengan akun apa pun yang terdaftar untuk membuka dashboard admin.</p>
        <label style="font-size:13px; font-weight:600;">Username</label>
        <input type="text" id="admin-username" placeholder="Username">
        <label style="font-size:13px; font-weight:600;">Password</label>
        <input type="password" id="admin-password" placeholder="Password" style="width:100%; padding:10px; margin:6px 0 10px 0; box-sizing:border-box; border:1px solid #d1d5db; border-radius:8px;">
        <button class="action-btn" onclick="handleAdminLogin()">Masuk</button>
        <p id="admin-auth-status" style="font-size:13px; font-weight:bold;"></p>
    </div>

    <div id="admin-main" style="display:none; width:100%; flex-direction:column; align-items:center;">
    <header>
        <div><h3>🛠️ Panel Admin</h3><span style="font-size:12px; color:#10b981; font-weight:bold;">● Super Admin</span></div>
        <div>
            <a href="../index.html" style="background:#10b981; color:white; padding:8px 14px; border-radius:8px; text-decoration:none; font-size:13px;">👤 Ke User</a>
            <button onclick="handleAdminLogout()" style="background:#ef4444; color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:600; cursor:pointer; font-size:12px; margin-left:8px;">Keluar</button>
        </div>
    </header>
    <div class="admin-view">
        <div class="admin-section-box"><h3 style="margin-top:0;">👥 Daftar Akun</h3><div class="user-filter-bar"><input type="text" id="user-search" placeholder="🔍 Cari username..." oninput="onUserFilterChange()"><select id="user-filter-block" onchange="onUserFilterChange()"><option value="all">Blokir: Semua</option><option value="blocked">Blokir: Diblokir</option><option value="open">Blokir: Tidak Diblokir</option></select><select id="user-filter-verify" onchange="onUserFilterChange()"><option value="all">Verifikasi: Semua</option><option value="verified">Verifikasi: Terverifikasi</option><option value="unverified">Verifikasi: Belum</option></select><select id="user-sort" onchange="onUserFilterChange()"><option value="newest">Urut: Terbaru</option><option value="oldest">Urut: Terlama</option><option value="balance-desc">Urut: Saldo Tertinggi</option><option value="balance-asc">Urut: Saldo Terendah</option><option value="name-asc">Urut: Username A-Z</option><option value="name-desc">Urut: Username Z-A</option></select><button class="action-btn" style="background:#6b7280;" onclick="resetUserFilter()">Reset</button></div><p id="user-count" style="font-size:13px; color:#4b5563; margin:0 0 10px 0;"></p><div id="admin-users-container"></div></div><div class="admin-section-box"><h3 style="margin-top:0;">🎁 Pengaturan Reward Iklan</h3><label style="font-size:13px; font-weight:600;">Reward per misi selesai (Rp):</label><input type="number" id="reward-input" min="0" max="1000000" step="1" placeholder="Contoh: 60" style="width:100%; padding:10px; margin:6px 0 10px 0; box-sizing:border-box; border:1px solid #d1d5db; border-radius:8px;"><button class="action-btn" onclick="saveReward()">Simpan Reward</button><p id="reward-status" style="font-size:13px; font-weight:bold; margin-top:8px;"></p></div>
        
        <div class="admin-section-box"><h3 style="margin-top:0;">🎯 Buat Misi Manual Resmi</h3><label style="font-size:13px; font-weight:600;">Nama Misi:</label><input type="text" id="am-title" placeholder="Contoh: Join grup Telegram" style="width:100%; padding:10px; margin:6px 0 10px 0; box-sizing:border-box; border:1px solid #d1d5db; border-radius:8px;"><label style="font-size:13px; font-weight:600;">Deskripsi:</label><input type="text" id="am-desc" placeholder="Contoh: Join grup lalu screenshot" style="width:100%; padding:10px; margin:6px 0 10px 0; box-sizing:border-box; border:1px solid #d1d5db; border-radius:8px;"><label style="font-size:13px; font-weight:600;">Foto Misi (opsional):</label><input type="file" id="am-photo" accept="image/*" style="width:100%; padding:10px; margin:6px 0 10px 0; box-sizing:border-box; border:1px solid #d1d5db; border-radius:8px;"><label style="font-size:13px; font-weight:600;">Link Misi:</label><input type="text" id="am-link" placeholder="https://..." style="width:100%; padding:10px; margin:6px 0 10px 0; box-sizing:border-box; border:1px solid #d1d5db; border-radius:8px;"><label style="font-size:13px; font-weight:600;">Profit Per Klik (Rp):</label><input type="number" id="am-reward" placeholder="Contoh: 100" oninput="updateAmPreview()" style="width:100%; padding:10px; margin:6px 0 10px 0; box-sizing:border-box; border:1px solid #d1d5db; border-radius:8px;"><label style="font-size:13px; font-weight:600;">Total Biaya (Rp):</label><input type="number" id="am-budget" placeholder="Contoh: 10000" oninput="updateAmPreview()" style="width:100%; padding:10px; margin:6px 0 10px 0; box-sizing:border-box; border:1px solid #d1d5db; border-radius:8px;"><p id="am-preview" style="font-size:13px; font-weight:600; color:#4b5563; margin:6px 0;"></p><button class="action-btn" onclick="createAdminMission()">Buat Misi Resmi</button></div><div class="admin-section-box"><h3 style="margin-top:0;">📋 Semua Misi Manual</h3><div id="admin-missions-container"></div></div><div class="admin-section-box"><h3 style="margin-top:0;">🕵️ Pengawasan Misi Manual</h3><div id="admin-submissions-container"></div></div><div class="admin-section-box"><h3 style="margin-top:0;">🛡️ Bukti Verifikasi</h3><div id="admin-verify-container"></div></div><div class="admin-section-box"><h3 style="margin-top:0;">💸 Withdraw</h3><div id="admin-wd-container"></div></div>
        <div class="admin-section-box"><h3 style="margin-top:0;">🔗 Kontrol Link Tombol</h3><div id="admin-links-container"></div></div>
    </div>
    </div>
    <script>
        const totalButtons = 10;
        let usersList = [];
        let missionLinks = Array(totalButtons).fill("https://sfl.gl/gMmpBje");

        function getToken() { try { return localStorage.getItem('nonton_token') || ''; } catch (e) { return ''; } }
        function setSession(token, username) {
            try {
                if (token) localStorage.setItem('nonton_token', token);
                if (username) localStorage.setItem('nonton_username', username);
            } catch (e) {}
        }
        function clearSession() {
            try { localStorage.removeItem('nonton_token'); localStorage.removeItem('nonton_username'); } catch (e) {}
        }
        async function api(path, method, body) {
            const headers = { 'Content-Type': 'application/json' };
            const token = getToken();
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const res = await fetch(path, { method: method || 'GET', headers, body: body ? JSON.stringify(body) : undefined });
            let data = {};
            try { data = await res.json(); } catch (e) {}
            if (!res.ok) {
                const err = new Error(data.error || ('Request gagal (' + res.status + ')'));
                err.status = res.status;
                throw err;
            }
            return data;
        }

        async function handleAdminLogin() {
            const u = document.getElementById('admin-username').value.trim();
            const p = document.getElementById('admin-password').value.trim();
            const st = document.getElementById('admin-auth-status');
            if (!u || !p) { st.style.color = '#ef4444'; st.innerText = 'Username & password wajib diisi.'; return; }
            try {
                const data = await api('/api/auth/login', 'POST', { username: u, password: p });
                setSession(data.token, data.user.username);
                showMain();
                await loadAdminData();
            } catch (e) {
                st.style.color = '#ef4444'; st.innerText = e.message || 'Gagal login.';
            }
        }
        function handleAdminLogout() { clearSession(); location.reload(); }
        function showMain() {
            document.getElementById('admin-auth').style.display = 'none';
            document.getElementById('admin-main').style.display = 'flex';
        }

        async function loadAdminData() {
            try {
                const [usersRes, linksRes] = await Promise.all([
                    api('/api/admin/users', 'GET'),
                    api('/api/admin/links', 'GET'),
                ]);
                usersList = usersRes.users || [];
                try {
                    const sRes = await api('/api/admin/settings', 'GET');
                    const ri = document.getElementById('reward-input');
                    if (ri && sRes && Number.isInteger(sRes.missionReward)) ri.value = sRes.missionReward;
                    if (sRes) { renderAdminMissions(sRes.missions || []); renderAdminSubmissions(sRes.submissions || []); }
                } catch (e) {}
                if (Array.isArray(linksRes.links) && linksRes.links.length === totalButtons) missionLinks = linksRes.links;
                renderAdmin();
            } catch (e) {
                if (e.status === 401) { clearSession(); location.reload(); return; }
                alert(e.message || 'Gagal memuat data admin.');
            }
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function getFilteredUsers() {
            const q = (document.getElementById('user-search') ? document.getElementById('user-search').value : '').trim().toLowerCase();
            const blockF = document.getElementById('user-filter-block') ? document.getElementById('user-filter-block').value : 'all';
            const verifyF = document.getElementById('user-filter-verify') ? document.getElementById('user-filter-verify').value : 'all';
            const sort = document.getElementById('user-sort') ? document.getElementById('user-sort').value : 'newest';
            let list = usersList.filter((u) => {
                if (q && (u.username || '').toLowerCase().indexOf(q) === -1) return false;
                if (blockF === 'blocked' && !u.isBlocked) return false;
                if (blockF === 'open' && u.isBlocked) return false;
                if (verifyF === 'verified' && !u.isVerified) return false;
                if (verifyF === 'unverified' && u.isVerified) return false;
                return true;
            });
            if (sort === 'oldest') list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
            else if (sort === 'balance-desc') list.sort((a, b) => (b.balance || 0) - (a.balance || 0));
            else if (sort === 'balance-asc') list.sort((a, b) => (a.balance || 0) - (b.balance || 0));
            else if (sort === 'name-asc') list.sort((a, b) => String(a.username).localeCompare(String(b.username)));
            else if (sort === 'name-desc') list.sort((a, b) => String(b.username).localeCompare(String(a.username)));
            else list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            return list;
        }
        function onUserFilterChange() { renderUsersSection(); }
        function resetUserFilter() {
            const s = document.getElementById('user-search'); if (s) s.value = '';
            const b = document.getElementById('user-filter-block'); if (b) b.value = 'all';
            const vf = document.getElementById('user-filter-verify'); if (vf) vf.value = 'all';
            const o = document.getElementById('user-sort'); if (o) o.value = 'newest';
            renderUsersSection();
        }
        function renderUsersSection() {
            const usersContainer = document.getElementById('admin-users-container');
            const filtered = getFilteredUsers();
            const countEl = document.getElementById('user-count');
            if (countEl) countEl.innerText = 'Menampilkan ' + filtered.length + ' dari ' + usersList.length + ' user';
            usersContainer.innerHTML = filtered.length === 0 ? "<p>Tidak ada user yang cocok dengan pencarian/filter.</p>" : "";
            filtered.forEach((usr) => {
                const activeRef = usersList.filter(x => x.referredBy === usr.username && x.isVerified).length;
                const totalRef = usersList.filter(x => x.referredBy === usr.username).length;
                usersContainer.innerHTML += `
                    <div class="admin-card" style="display:flex; justify-content:space-between; align-items:center;">
                        <div><b>${esc(usr.username)}</b><br><span style="color:${usr.isBlocked?'#ef4444':'#10b981'};">Saldo: Rp ${(usr.balance || 0).toLocaleString('id-ID')} | ${usr.isVerified ? '✅ Terverifikasi' : '❌ Belum Verifikasi'}</span><br><span style="font-size:12px; color:#4b5563;">Referral: ${totalRef} total | ${activeRef} aktif | Bonus: Rp ${(usr.referralEarnings || 0).toLocaleString('id-ID')}${usr.referredBy ? ' | Diundang oleh: ' + esc(usr.referredBy) : ''}</span></div>
                        <div style="display:flex; gap:6px;">
                            <button class="action-btn" style="background:${usr.isVerified?'#6b7280':'#10b981'}" onclick="toggleVerify('${esc(usr.username)}', ${!usr.isVerified})">${usr.isVerified?'Cabut Verifikasi':'Verifikasi'}</button>
                            <button class="action-btn" style="background:${usr.isBlocked?'#10b981':'#ef4444'}" onclick="toggleBlock('${esc(usr.username)}', ${!usr.isBlocked})">${usr.isBlocked?'Buka':'Blokir'}</button>
                        </div>
                    </div>`;
            });
        }

        function renderAdmin() {
            renderUsersSection();

            const verifyContainer = document.getElementById('admin-verify-container');
            if (verifyContainer) {
                const withProof = usersList.filter(u => u.verificationProofUrl);
                verifyContainer.innerHTML = withProof.length === 0 ? "<p>Tidak ada bukti verifikasi.</p>" : "";
                withProof.forEach(usr => {
                    verifyContainer.innerHTML += `
                        <div class="admin-card">
                            <p><b>User:</b> ${esc(usr.username)} — ${usr.isVerified ? '✅ Terverifikasi' : '❌ Belum Terverifikasi'}</p>
                            <img src="${esc(usr.verificationProofUrl)}" style="max-width:150px; border-radius:6px; display:block; margin-bottom:8px;">
                            <a href="${esc(usr.verificationProofUrl)}" download="${esc(usr.verificationProofName || 'bukti-verifikasi')}" class="action-btn" style="text-decoration:none; background:#10b981;">Download</a>
                            <button class="action-btn" style="background:${usr.isVerified?'#6b7280':'#10b981'}" onclick="toggleVerify('${esc(usr.username)}', ${!usr.isVerified})">${usr.isVerified?'Cabut Verifikasi':'Verifikasi'}</button>
                        </div>`;
                });
            }

            const wdContainer = document.getElementById('admin-wd-container');
            const allWd = [];
            usersList.forEach(u => (u.withdrawRequests || []).forEach(w => allWd.push({ ...w, username: u.username })));
            wdContainer.innerHTML = allWd.length === 0 ? "<p>Tidak ada withdraw.</p>" : "";
            allWd.forEach((wd) => {
                wdContainer.innerHTML += `
                    <div class="admin-card">
                        <p><b>${esc(wd.username)}</b> - Rp ${(wd.amount || 0).toLocaleString('id-ID')} (${esc(wd.status)})</p>
                        ${wd.status==='Pending'?`<button class="action-btn" style="background:#10b981;" onclick="processWD('${esc(wd.username)}', '${esc(wd.id)}', 'Disetujui')">Setujui</button> <button class="action-btn" style="background:#ef4444;" onclick="processWD('${esc(wd.username)}', '${esc(wd.id)}', 'Ditolak')">Tolak</button>`:''}
                    </div>`;
            });

            const linksContainer = document.getElementById('admin-links-container');
            linksContainer.innerHTML = "";
            for (let i = 0; i < totalButtons; i++) {
                linksContainer.innerHTML += `
                    <div class="admin-card">
                        <label>Tombol #${i+1}:</label>
                        <input type="text" id="link-${i}" value="${esc(missionLinks[i])}">
                        <button class="action-btn" onclick="saveLink(${i})">Simpan</button>
                    </div>`;
            }
        }

        async function toggleVerify(username, verified) {
            try {
                await api('/api/admin/block', 'POST', { username, verified });
                await loadAdminData();
            } catch (e) { alert(e.message || 'Gagal mengubah verifikasi.'); }
        }

        async function toggleBlock(username, blocked) {
            try {
                await api('/api/admin/block', 'POST', { username, blocked });
                await loadAdminData();
            } catch (e) { alert(e.message || 'Gagal mengubah blokir.'); }
        }

        async function saveLink(i) {
            const links = [];
            for (let j = 0; j < totalButtons; j++) {
                const el = document.getElementById(`link-${j}`);
                links.push(el ? el.value.trim() : missionLinks[j]);
            }
            try {
                const data = await api('/api/admin/links', 'POST', { links });
                missionLinks = data.links;
                alert("Link disimpan!");
            } catch (e) { alert(e.message || 'Gagal menyimpan link.'); }
        }

        async function processWD(username, withdrawId, status) {
            try {
                await api('/api/admin/withdraw', 'POST', { username, withdrawId, status });
                await loadAdminData();
            } catch (e) { alert(e.message || 'Gagal memproses withdraw.'); }
        }


        function compressImageFileAdmin(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const scale = 400 / img.width;
                        canvas.width = 400; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function updateAmPreview() {
            const el = document.getElementById('am-preview');
            if (!el) return;
            const reward = parseInt((document.getElementById('am-reward') || {}).value, 10) || 0;
            const budget = parseInt((document.getElementById('am-budget') || {}).value, 10) || 0;
            if (reward < 1 || budget < 1) { el.innerText = 'Isi profit dan total biaya untuk melihat estimasi klik.'; return; }
            const fee = Math.floor(budget * 0.05);
            const clicks = Math.floor((budget - fee) / reward);
            el.innerText = clicks < 1 ? 'Budget terlalu kecil untuk 1 klik setelah biaya 5%.' :
                'Biaya platform 5%: Rp ' + fee.toLocaleString('id-ID') + ' • Estimasi klik: ' + clicks + ' klik';
        }

        async function createAdminMission() {
            const title = document.getElementById('am-title').value.trim();
            const description = document.getElementById('am-desc').value.trim();
            const link = document.getElementById('am-link').value.trim();
            const reward = parseInt(document.getElementById('am-reward').value, 10);
            const budget = parseInt(document.getElementById('am-budget').value, 10);
            if (!title || !link || !reward || !budget) { alert('Nama, link, profit, dan total biaya wajib diisi!'); return; }
            try {
                let photoUrl = null;
                const photoInput = document.getElementById('am-photo');
                if (photoInput && photoInput.files && photoInput.files.length > 0) {
                    photoUrl = await compressImageFileAdmin(photoInput.files[0]);
                }
                const data = await api('/api/admin/settings', 'POST', { action: 'createMission', title, description, photoUrl, link, reward, budget });
                alert('Misi resmi dibuat: ' + data.mission.clicksTotal + ' klik.');
                document.getElementById('am-title').value = '';
                document.getElementById('am-desc').value = '';
                document.getElementById('am-link').value = '';
                document.getElementById('am-reward').value = '';
                document.getElementById('am-budget').value = '';
                await loadAdminData();
            } catch (e) { alert(e.message || 'Gagal membuat misi.'); }
        }

        function renderAdminMissions(missions) {
            const c = document.getElementById('admin-missions-container');
            if (!c) return;
            if (!missions || missions.length === 0) { c.innerHTML = '<p>Belum ada misi manual.</p>'; return; }
            c.innerHTML = '';
            missions.forEach(m => {
                c.innerHTML += '<div class="admin-card"><p style="margin:0;"><b>' + esc(m.title) + '</b> ' + (m.isOfficial ? '(⭐ RESMI)' : '(user: ' + esc(m.creator) + ')') + '<br><span style="font-size:13px; color:#4b5563;">+Rp ' + (m.reward || 0).toLocaleString('id-ID') + '/klik • Sisa ' + m.clicksLeft + '/' + m.clicksTotal + ' • Status: ' + esc(m.status) + ' • Budget Rp ' + (m.budgetTotal || 0).toLocaleString('id-ID') + ' (fee Rp ' + (m.fee || 0).toLocaleString('id-ID') + ')</span></p></div>';
            });
        }

        function renderAdminSubmissions(subs) {
            const c = document.getElementById('admin-submissions-container');
            if (!c) return;
            if (!subs || subs.length === 0) { c.innerHTML = '<p>Belum ada pengiriman misi manual.</p>'; return; }
            c.innerHTML = '';
            subs.forEach(s => {
                c.innerHTML += '<div class="admin-card"><p><b>User:</b> ' + esc(s.username) + ' — <b>Misi:</b> ' + esc(s.missionTitle || s.missionId) + ' — <b>Reward:</b> Rp ' + (s.reward || 0).toLocaleString('id-ID') + ' — ' + (s.status === 'approved' ? '✅ Disetujui (otomatis)' : '❌ Digagalkan') + '</p>' +
                    (s.proofUrl ? '<img src="' + esc(s.proofUrl) + '" style="max-width:150px; border-radius:6px; display:block; margin-bottom:8px;"><a href="' + esc(s.proofUrl) + '" download="' + esc(s.proofName || 'bukti-misi') + '" class="action-btn" style="text-decoration:none; background:#10b981;">Download</a> ' : '') +
                    (s.status === 'approved' ? '<button class="action-btn" style="background:#ef4444;" onclick="rejectSubmission(\'' + s.id + '\')">Gagalkan (Potong Saldo)</button>' : '') +
                    '</div>';
            });
        }

        async function rejectSubmission(id) {
            if (!confirm('Gagalkan pengiriman ini? Reward akan dipotong balik dari saldo user.')) return;
            try {
                const data = await api('/api/admin/settings', 'POST', { action: 'rejectSubmission', submissionId: id });
                alert('Pengiriman digagalkan. Saldo user dipotong Rp ' + (data.deducted || 0).toLocaleString('id-ID') + '.');
                await loadAdminData();
            } catch (e) { alert(e.message || 'Gagal menggagalkan.'); }
        }

        async function saveReward() {
            const input = document.getElementById('reward-input');
            const st = document.getElementById('reward-status');
            const val = parseInt(input.value, 10);
            if (!Number.isInteger(val) || val < 0 || val > 1000000) {
                st.style.color = '#ef4444'; st.innerText = 'Reward harus bilangan bulat 0 - 1.000.000.'; return;
            }
            try {
                const data = await api('/api/admin/settings', 'POST', { missionReward: val });
                input.value = data.missionReward;
                st.style.color = '#10b981'; st.innerText = 'Reward disimpan: Rp ' + data.missionReward.toLocaleString('id-ID') + ' per misi.';
            } catch (e) {
                st.style.color = '#ef4444'; st.innerText = e.message || 'Gagal menyimpan reward.';
            }
        }

        (async function initAdmin() {
            const token = getToken();
            if (!token) return;
            try {
                await api('/api/me', 'GET');
                showMain();
                await loadAdminData();
            } catch (e) {
                clearSession();
            }
        })();
    </script>
</body>
</html>
