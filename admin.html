<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Admin - Kontrol Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        header, .admin-view { width: 100%; max-width: 950px; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; box-sizing: border-box; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .admin-section-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .admin-card { background: white; padding: 15px; border-radius: 10px; border: 1px solid #e5e7eb; margin-bottom: 10px; }
        .action-btn { background: #4f46e5; color: white; border: none; padding: 10px 15px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; }
        input[type="text"] { width: 100%; padding: 10px; margin: 6px 0 10px 0; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; }
    </style>
</head>
<body>
    <header>
        <div><h3>🛠️ Panel Admin</h3><span style="font-size:12px; color:#10b981; font-weight:bold;">● Super Admin</span></div>
        <div><a href="../index.html" style="background:#10b981; color:white; padding:8px 14px; border-radius:8px; text-decoration:none; font-size:13px;">👤 Ke User</a></div>
    </header>
    <div class="admin-view">
        <div class="admin-section-box"><h3 style="margin-top:0;">👥 Daftar Akun</h3><div id="admin-users-container"></div></div>
        <div class="admin-section-box"><h3 style="margin-top:0;">💳 Bukti Pembayaran</h3><div id="admin-sub-container"></div></div>
        <div class="admin-section-box"><h3 style="margin-top:0;">💸 Withdraw</h3><div id="admin-wd-container"></div></div>
        <div class="admin-section-box"><h3 style="margin-top:0;">🔗 Kontrol Link Tombol</h3><div id="admin-links-container"></div></div>
    </div>
    <script>
        const totalButtons = 10;
        let missionLinks = JSON.parse(localStorage.getItem('missionLinks')) || Array(totalButtons).fill("https://sfl.gl/gMmpBje");

        function renderAdmin() {
            let usersList = JSON.parse(localStorage.getItem('usersList')) || [];
            const usersContainer = document.getElementById('admin-users-container');
            usersContainer.innerHTML = usersList.length === 0 ? "<p>Belum ada user.</p>" : "";
            usersList.forEach((usr, idx) => {
                usersContainer.innerHTML += `
                    <div class="admin-card" style="display:flex; justify-content:space-between; align-items:center;">
                        <div><b>${usr.username}</b><br><span style="color:${usr.isBlocked?'#ef4444':'#10b981'};">Saldo: Rp ${usr.balance.toLocaleString('id-ID')} | VIP: ${usr.subStatus}</span></div>
                        <button class="action-btn" style="background:${usr.isBlocked?'#10b981':'#ef4444'}" onclick="toggleBlock(${idx})">${usr.isBlocked?'Buka':'Blokir'}</button>
                    </div>`;
            });

            const subContainer = document.getElementById('admin-sub-container');
            let activeSubs = usersList.filter(u => u.paymentProofUrl);
            subContainer.innerHTML = activeSubs.length === 0 ? "<p>Tidak ada bukti.</p>" : "";
            activeSubs.forEach(usr => {
                subContainer.innerHTML += `
                    <div class="admin-card">
                        <p><b>User:</b> ${usr.username}</p>
                        <img src="${usr.paymentProofUrl}" style="max-width:150px; border-radius:6px; display:block; margin-bottom:8px;">
                        <a href="${usr.paymentProofUrl}" download="${usr.paymentProofName}" class="action-btn" style="text-decoration:none; background:#10b981;">Download</a>
                    </div>`;
            });

            let allWd = JSON.parse(localStorage.getItem('allWithdraws')) || [];
            const wdContainer = document.getElementById('admin-wd-container');
            wdContainer.innerHTML = allWd.length === 0 ? "<p>Tidak ada withdraw.</p>" : "";
            allWd.forEach((wd, idx) => {
                wdContainer.innerHTML += `
                    <div class="admin-card">
                        <p><b>${wd.username}</b> - Rp ${wd.amount.toLocaleString('id-ID')} (${wd.status})</p>
                        ${wd.status==='Pending'?`<button class="action-btn" style="background:#10b981;" onclick="processWD(${idx}, 'Disetujui')">Setujui</button> <button class="action-btn" style="background:#ef4444;" onclick="processWD(${idx}, 'Ditolak')">Tolak</button>`:''}
                    </div>`;
            });

            const linksContainer = document.getElementById('admin-links-container');
            linksContainer.innerHTML = "";
            for (let i = 0; i < totalButtons; i++) {
                linksContainer.innerHTML += `
                    <div class="admin-card">
                        <label>Tombol #${i+1}:</label>
                        <input type="text" id="link-${i}" value="${missionLinks[i]}">
                        <button class="action-btn" onclick="saveLink(${i})">Simpan</button>
                    </div>`;
            }
        }

        function toggleBlock(i) {
            let list = JSON.parse(localStorage.getItem('usersList')) || [];
            list[i].isBlocked = !list[i].isBlocked;
            localStorage.setItem('usersList', JSON.stringify(list));
            renderAdmin();
        }

        function saveLink(i) {
            missionLinks[i] = document.getElementById(`link-${i}`).value.trim();
            localStorage.setItem('missionLinks', JSON.stringify(missionLinks));
            alert("Link disimpan!");
        }

        function processWD(idx, status) {
            let allWd = JSON.parse(localStorage.getItem('allWithdraws')) || [];
            allWd[idx].status = status;
            if (status === 'Ditolak') {
                let list = JSON.parse(localStorage.getItem('usersList')) || [];
                let usr = list.find(x => x.username === allWd[idx].username);
                if (usr) { usr.balance += allWd[idx].amount; localStorage.setItem('usersList', JSON.stringify(list)); }
            }
            localStorage.setItem('allWithdraws', JSON.stringify(allWd));
            renderAdmin();
        }

        renderAdmin();
    </script>
</body>
</html>
