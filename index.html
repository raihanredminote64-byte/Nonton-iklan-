<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Nonton Iklan - Pengguna</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .card-box {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            box-sizing: border-box;
            text-align: center;
            margin-top: 40px;
        }
        header {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .wallet-badge {
            background: #ecfdf5;
            color: var(--success);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
        }
        .subscription-banner {
            width: 100%;
            max-width: 950px;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 1px solid #fde68a;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 950px;
        }
        .ad-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 4px solid #6366f1;
        }
        .action-btn, .ad-button {
            background: var(--bg-gradient);
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .action-btn:disabled, .ad-button:disabled {
            background: #d1d5db;
            color: #6b7280;
            cursor: not-allowed;
        }
        input[type="text"], input[type="password"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 380px;
            width: 90%;
        }
    </style>
</head>
<body>
    <div id="auth-screen" class="card-box">
        <h2 style="color: var(--primary); margin-top: 0;">🔐 Masuk / Daftar Akun</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Masukkan Username & Password untuk menyimpan progres saldo & misi Anda.</p>
        <input type="text" id="input-username" placeholder="Username (contoh: budi123)">
        <input type="password" id="input-password" placeholder="Password akun">
        <button class="action-btn" onclick="handleUserLogin()">Masuk / Mulai Misi</button>
    </div>

    <div id="main-app" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        <header>
            <div>
                <h3 id="display-username" style="margin:0; font-size: 17px;">Akun: -</h3>
                <span id="account-status" style="font-size: 12px; font-weight: bold; color: var(--success);">● Status: Aktif</span>
            </div>
            <div class="wallet-badge">
                💰 Rp <span id="balance">0</span>
            </div>
            <div>
                <button onclick="handleLogout()" style="background:#ef4444; color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:600; cursor:pointer; font-size:12px;">Keluar</button>
            </div>
        </header>

        <div class="subscription-banner">
            <h3 style="margin: 0; color: #b45309; font-size: 16px;">⭐ Status Akses VIP (Top Up Rp 5.000 / 7 Hari)</h3>
            <p id="sub-status-text" style="color: #92400e; font-size: 13px; margin: 8px 0;">Memuat status langganan...</p>
            <div id="sub-action-area"></div>
        </div>

        <div class="container" id="button-container"></div>
        
        <div style="width: 100%; max-width: 950px; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 25px; box-sizing: border-box;">
            <h3 style="margin-top: 0; font-size: 17px;">💸 Tarik Saldo (Withdraw)</h3>
            <label style="font-weight: 600; font-size: 13px;">Jumlah Penarikan (Rp):</label>
            <input type="number" id="wd-amount" placeholder="Minimal Rp 100.000">
            <label style="font-weight: 600; font-size: 13px;">Nomor Rekening / E-Wallet:</label>
            <input type="text" id="wd-account" placeholder="Contoh: DANA 08123456789">
            <button class="action-btn" onclick="requestWithdraw()">Ajukan Penarikan</button>
            <p id="wd-status" style="font-size: 13px; font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h2 id="infoModalTitle" style="margin-top: 0;">Status Misi</h2>
            <p id="infoModalText" style="color: #4b5563; font-size: 14px; line-height: 1.5;"></p>
            <button class="action-btn" style="margin-top: 15px;" onclick="closeInfoModal()">Tutup</button>
        </div>
    </div>

    <script>
        const totalButtons = 10;
        let activeUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        const danaPaymentUrl = "https://link.dana.id/minta?full_url=https://qr.dana.id/v1/281012092026101995063273";

        function handleUserLogin() {
            const u = document.getElementById('input-username').value.trim();
            const p = document.getElementById('input-password').value.trim();
            if (!u || !p) { alert("Username & password wajib diisi!"); return; }
            let usersList = JSON.parse(localStorage.getItem('usersList')) || [];
            let found = usersList.find(x => x.username === u);
            if (found) {
                if (found.password !== p) { alert("Password salah!"); return; }
                if (found.isBlocked) { alert("Akun diblokir."); return; }
                activeUser = found;
            } else {
                activeUser = {
                    username: u, password: p, balance: 0, isBlocked: false,
                    subStatus: 'inactive', subExpiryDate: null, paymentProofName: null,
                    paymentProofUrl: null, missionCompleted: Array(totalButtons).fill(false)
                };
                usersList.push(activeUser);
                localStorage.setItem('usersList', JSON.stringify(usersList));
            }
            localStorage.setItem('currentUser', JSON.stringify(activeUser));
            loadAppUI();
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }

        function saveActiveUser() {
            localStorage.setItem('currentUser', JSON.stringify(activeUser));
            let usersList = JSON.parse(localStorage.getItem('usersList')) || [];
            let idx = usersList.findIndex(x => x.username === activeUser.username);
            if (idx !== -1) { usersList[idx] = activeUser; localStorage.setItem('usersList', JSON.stringify(usersList)); }
        }

        function loadAppUI() {
            if (!activeUser) return;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('display-username').innerText = `Akun: ${activeUser.username}`;
            renderUserMissions();
        }

        function showInfoPopup(title, message, isSuccess) {
            document.getElementById('infoModalTitle').innerText = title;
            document.getElementById('infoModalTitle').style.color = isSuccess ? '#10b981' : '#ef4444';
            document.getElementById('infoModalText').innerHTML = message;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeInfoModal() { document.getElementById('infoModal').style.display = 'none'; }

        function renderSubscriptionBox() {
            if (activeUser.subStatus === 'active' && activeUser.subExpiryDate && new Date().getTime() > activeUser.subExpiryDate) {
                activeUser.subStatus = 'inactive'; activeUser.subExpiryDate = null; saveActiveUser();
            }
            const statusText = document.getElementById('sub-status-text');
            const actionArea = document.getElementById('sub-action-area');
            if (activeUser.subStatus === 'active') {
                const days = Math.max(1, Math.ceil((activeUser.subExpiryDate - new Date().getTime()) / (1000 * 60 * 60 * 24)));
                statusText.innerHTML = `✅ <b>VIP Aktif</b> (Sisa ${days} hari).`;
                actionArea.innerHTML = `<button class="action-btn" style="background:#d97706; width:auto; padding:8px 16px;" onclick="window.open('${danaPaymentUrl}', '_blank')">Perpanjang (Rp 5.000)</button>`;
            } else {
                statusText.innerHTML = `❌ <b>Akses Terkunci!</b> Top up Rp 5.000 untuk 7 hari.`;
                actionArea.innerHTML = `
                    <button class="action-btn" style="background:#10b981;" onclick="window.open('${danaPaymentUrl}', '_blank')">🚀 1. Bayar via DANA</button>
                    <div style="background:white; padding:10px; border:1px dashed #d97706; border-radius:8px; margin-top:8px;">
                        <label style="font-size:12px; font-weight:bold;">2. Upload Screenshot Bukti:</label>
                        <input type="file" id="proof-file" accept="image/*">
                        <button class="action-btn" onclick="submitProof()">Kirim & Buka Kunci</button>
                    </div>
                `;
            }
        }

        function submitProof() {
            const fileInput = document.getElementById('proof-file');
            if (!fileInput.files || fileInput.files.length === 0) { alert("Pilih file bukti!"); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const scale = 400 / img.width;
                    canvas.width = 400; canvas.height = img.height * scale;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    activeUser.paymentProofName = fileInput.files[0].name;
                    activeUser.paymentProofUrl = canvas.toDataURL('image/jpeg', 0.6);
                    activeUser.subStatus = 'active';
                    activeUser.subExpiryDate = new Date().getTime() + (7 * 24 * 60 * 60 * 1000);
                    saveActiveUser();
                    showInfoPopup("Berhasil!", "VIP Aktif Otomatis!", true);
                    renderUserMissions();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function renderUserMissions() {
            renderSubscriptionBox();
            document.getElementById('balance').innerText = activeUser.balance.toLocaleString('id-ID');
            let missionLinks = JSON.parse(localStorage.getItem('missionLinks')) || Array(totalButtons).fill("https://sfl.gl/gMmpBje");
            const container = document.getElementById('button-container');
            container.innerHTML = "";
            for (let i = 0; i < totalButtons; i++) {
                const card = document.createElement('div');
                card.className = 'ad-card';
                card.innerHTML = `<div style="font-weight:700;">Misi #${i + 1}</div><div style="color:#10b981; font-size:13px;">+Rp 60</div>`;
                const btn = document.createElement('button');
                btn.className = 'ad-button';
                if (activeUser.isBlocked) { btn.innerText = "Diblokir"; btn.disabled = true; }
                else if (activeUser.subStatus !== 'active') { btn.innerText = "Terkunci"; btn.disabled = true; }
                else if (activeUser.missionCompleted[i]) { btn.innerText = "Selesai"; btn.disabled = true; btn.style.background = '#10b981'; }
                else { btn.innerText = "Mulai Misi"; btn.onclick = () => startMission(i, missionLinks[i]); }
                card.appendChild(btn); container.appendChild(card);
            }
        }

        function startMission(index, url) {
            const win = window.open(url, '_blank');
            if (!win) { showInfoPopup("Gagal", "Popup diblokir browser. Izinkan popup untuk situs ini lalu ulangi misi.", false); return; }
            activeUser.missionCompleted[index] = true; activeUser.balance += 60;
            saveActiveUser(); renderUserMissions();
            showInfoPopup("Sukses!", "+Rp 60 ditambahkan.", true);
        }

        function requestWithdraw() {
            if (activeUser.isBlocked) return;
            const amount = parseInt(document.getElementById('wd-amount').value);
            const account = document.getElementById('wd-account').value.trim();
            const stat = document.getElementById('wd-status');
            if (!amount || amount < 100000 || amount > activeUser.balance || !account) {
                stat.style.color = '#ef4444'; stat.innerText = "Minimal 100rb & saldo cukup!"; return;
            }
            activeUser.balance -= amount; saveActiveUser();
            let allWd = JSON.parse(localStorage.getItem('allWithdraws')) || [];
            allWd.push({ username: activeUser.username, amount: amount, account: account, status: "Pending" });
            localStorage.setItem('allWithdraws', JSON.stringify(allWd));
            stat.style.color = '#10b981'; stat.innerText = "Withdraw diajukan!";
            document.getElementById('wd-amount').value = ""; document.getElementById('wd-account').value = "";
            renderUserMissions();
        }

        if (activeUser) loadAppUI();
    </script>
</body>
</html>
